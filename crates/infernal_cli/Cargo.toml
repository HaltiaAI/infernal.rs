[package]
name = "infernal_cli"
version = "0.1.0"
description = "Infernal CLI"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
num_cpus.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Apple Silicon
[target.'cfg(all(any(target_os="macos", target_os="ios"), any(target_arch="aarch64", target_arch="arm")))'.dependencies]
infernal = { workspace = true, features = ["metal"] }
infernal_bench = { workspace = true, features = ["metal"] }

