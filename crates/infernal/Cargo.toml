[package]
name = "infernal"
version = "0.0.1"
description = "ML framework for inferencing"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
cfg-if.workspace = true
gguf.workspace = true
libc.workspace = true
memmap2.workspace = true
metal.workspace = true
objc.workspace = true
smallvec.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true

# graph-inspect
blake3.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sysinfo = "0.30.12"

[dev-dependencies]
anyhow.workspace = true
criterion.workspace = true
ggml = { workspace = true, features = ["metal"] }
tracing-subscriber.workspace = true
dirs.workspace = true
llama_cpp_sys.workspace = true
approx = "0.5"

[[bench]]
name = "matmul"
harness = false

[features]
# TODO: move this out
default = ["graph-inspect"]
graph-inspect = ["serde", "serde_json"]
# TODO
metal = []

# NOTE: Enable this flag to run all the CPU backend unit tests with the Metal backend,
# this is to ensure the correctness of the CPU backend against the Metal backend
test-cpu-with-metal = []
