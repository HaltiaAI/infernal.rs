# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
  "crates/*"
]
resolver = "2"

[workspace.package]
authors = ["Haltia.AI"]
edition = "2021"
rust-version = "1.71"
documentation = "infernal.rs"
readme = true
homepage = "infernal.rs"
repository = "https://github.com/HaltiaAI/infernal.rs"
license-file = "UNLICENSE"
keywords = ["ml", "llm", "ai", "inferencing", "llama"]
categories = []
publish = false

[workspace.dependencies]
anyhow = "1.0.72"
base58 = "0.2.0"
blake3 = { version = "1.5", features = ["serde"] }
bytes = "1.5.0"
cfg-if = "1.0.0"
criterion = "0.5"
byteorder = "1"
clap = { version = "4.5.7", features = ["color", "derive", "unicode"] }
reqwest = { version = "0.12.4", features = ["json"] }
dirs = "5.0.1"
ggml = { path = "crates/ggml" }
gguf = { path = "crates/gguf" }
hex = "0.4.3"
infernal = { path = "crates/infernal" }
infernal_llm = { path = "crates/infernal_llm" }
infernal_bench = { path = "crates/infernal_bench" }
llama_cpp_sys = { path = "crates/llama_cpp_sys"}
libc = "0.2"
metal = "0.28.0"
memmap2 = "0.9.4"
num_cpus = "1.16.0"
objc = { version = "0.2.4", features = ["objc_exception"] }
once_cell = "1.18.0"
rand = "0.8.5"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.103"
smallvec = "1.11.2"
strum = { version = "0.26", features = ["derive"] }
tempfile = "3.6.0"
thiserror = "1.0.47"
toml = "0.8"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = [
    "env-filter",
    "registry",
] }
url = "2.4.1"
